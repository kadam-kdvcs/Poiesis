plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.46'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            environment 'assets_root', file('D:/Minecraft/assets').absolutePath

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Runtime mod dependencies such as Jade ship SRG-named Mixin refmaps.
            // Remap those targets to the Parchment names used by this dev workspace.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {

    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    // at runtime, use the full JEI jar for Forge
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))
    compileOnly fg.deobf("curse.maven:mekanism-268560:6552911")
    if (!project.hasProperty("without_mekanism")) {
        runtimeOnly fg.deobf("curse.maven:mekanism-268560:6552911")
    }
    compileOnly fg.deobf("curse.maven:jade-324717:6855440")
    if (!project.hasProperty("without_jade")) {
        runtimeOnly fg.deobf("curse.maven:jade-324717:6855440")
    }
    compileOnly fg.deobf("curse.maven:ender-io-64578:7726916")
    if (!project.hasProperty("without_enderio")) {
        runtimeOnly fg.deobf("curse.maven:ender-io-64578:7726916")
    }
    if (!project.hasProperty("without_thermal")) {
        runtimeOnly fg.deobf("curse.maven:cofh-core-69162:5374122")
        runtimeOnly fg.deobf("curse.maven:thermal-foundation-222880:5443583")
        runtimeOnly fg.deobf("curse.maven:thermal-expansion-69163:4970700")
    }


}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ["-Xlint:-removal"]
}

gradle.projectsEvaluated {

    def removeDep = { Task t, String depName ->
        if (t == null) return
        t.dependsOn.removeAll { dep ->
            (dep instanceof Task && dep.name.equalsIgnoreCase(depName)) ||
                    (dep instanceof String && dep.equalsIgnoreCase(depName))
        }
    }

    def killDownloadAssetsFor = { String taskName ->
        def t = tasks.findByName(taskName)
        removeDep(t, "downloadAssets")
    }

    [
            "prepareRuns",
            "prepareRunClient",
            "prepareRunClientCompile",
            "prepareRunServer",
            "prepareRunData",
            "prepareRunDataCompile"
    ].each { killDownloadAssetsFor(it) }

    ["runClient", "runData", "runServer", "rundata", "runclient", "runserver"].each { killDownloadAssetsFor(it) }
}

tasks.matching { it.name.equalsIgnoreCase("downloadAssets") }.configureEach {
    enabled = false
}

